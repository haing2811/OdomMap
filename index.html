<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>OdomMap</title>
	<script>
		// Keep bare /odom-map working: redirect to /odom-map/ before assets load.
		if (location.pathname === '/odom-map') {
			location.replace('/odom-map/' + location.search + location.hash);
		}
	</script>
	<link rel="manifest" href="manifest.json">
	<meta name="theme-color" content="#0A0A0B">
	<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
	<link rel="preload" as="font" href="assets/fonts/geist/geist-latin-wght-normal.woff2" type="font/woff2" crossorigin>
	<link rel="preload" as="font" href="assets/fonts/geist/geist-latin-wght-italic.woff2" type="font/woff2" crossorigin>
	<link rel="preload" as="font" href="assets/fonts/geist-mono/geist-mono-latin-wght-normal.woff2" type="font/woff2" crossorigin>
	<link rel="preload" as="font" href="assets/fonts/geist-mono/geist-mono-latin-wght-italic.woff2" type="font/woff2" crossorigin>
	<link rel="stylesheet" href="css/app.css">
</head>
<body>
	<div id="loading">
		<div class="spinner"></div>
		<p>Loading field…</p>
	</div>

	<div class="topbar">
		<h1><span>OdomMap</span></h1>
		<div class="field-group">
			<label>Competition</label>
			<select id="sel-competition"></select>
			<label>Year</label>
			<select id="sel-year"></select>
			<label>Category</label>
			<select id="sel-category"></select>
		</div>
		<div class="field-group">
			<label>Wheel (mm)</label>
			<input type="number" id="wheel-diameter" value="62.4" step="0.1" min="1">
		</div>
		<button id="install-btn" class="install-btn hidden">Install</button>
	</div>

	<div class="modebar" id="modebar" role="radiogroup" aria-label="Mode">
		<button class="modebtn active" data-mode="normal" aria-pressed="true">Measure</button>
		<button class="modebtn" data-mode="odometry" aria-pressed="false">Odometry</button>
		<button class="modebtn" data-mode="route" aria-pressed="false">Route</button>
	</div>

	<main>
		<div class="canvas-stage" role="region" aria-label="Field canvas">
			<div id="canvas-container" tabindex="0">
				<canvas id="canvas" width="800" height="400" aria-label="Field measurement canvas" role="img"></canvas>
			</div>
		</div>
		<div class="panel" id="field-panel">
			<div class="panel-inner">
				<div id="field-note" class="field-note d-none"></div>
				<div id="mode-panel"></div>
			</div>
		</div>
	</main>

	<script type="module" src="js/app.js"></script>
</body>
</html>
